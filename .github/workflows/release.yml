name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2022]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ROOT_LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          SITE_PACKAGE_VERSION="$(node -p "require('./site/package.json').version")"
          SITE_LOCK_VERSION="$(node -p "require('./site/package-lock.json').packages[''].version")"
          CARGO_PACKAGE_VERSION="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).packages.find((entry) => entry.name === 'mclip').version")"
          CARGO_LOCK_VERSION="$(awk '$0 == "name = \"mclip\"" { getline; gsub(/^version = \"|\"$/, ""); print; exit }' src-tauri/Cargo.lock)"

          for VERSION_SOURCE in \
            "package.json:$ROOT_PACKAGE_VERSION" \
            "package-lock.json:$ROOT_LOCK_VERSION" \
            "site/package.json:$SITE_PACKAGE_VERSION" \
            "site/package-lock.json:$SITE_LOCK_VERSION" \
            "src-tauri/Cargo.toml:$CARGO_PACKAGE_VERSION" \
            "src-tauri/Cargo.lock:$CARGO_LOCK_VERSION"
          do
            SOURCE_NAME="${VERSION_SOURCE%%:*}"
            SOURCE_VERSION="${VERSION_SOURCE#*:}"
            if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
              echo "Tag version ($TAG_VERSION) does not match $SOURCE_NAME ($SOURCE_VERSION)."
              exit 1
            fi
          done

      - name: Build mclip-cli release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin mclip-cli --release

      - name: Prepare mclip-cli release asset
        id: cli_asset
        shell: bash
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            macOS:ARM64)
              ASSET_NAME="mclip-cli-darwin-arm64"
              SOURCE_PATH="src-tauri/target/release/mclip-cli"
              ;;
            Windows:X64)
              ASSET_NAME="mclip-cli-windows-x64.exe"
              SOURCE_PATH="src-tauri/target/release/mclip-cli.exe"
              ;;
            *)
              echo "No published mclip-cli asset mapping for $RUNNER_OS:$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$("$SOURCE_PATH" --version)"
          if [ "$CLI_VERSION" != "mclip-cli $TAG_VERSION" ]; then
            echo "Built CLI version ($CLI_VERSION) does not match tag version ($TAG_VERSION)." >&2
            exit 1
          fi

          mkdir -p cli-dist
          cp "$SOURCE_PATH" "cli-dist/$ASSET_NAME"
          node -e "const crypto=require('crypto');const fs=require('fs');const path=require('path');const file=process.argv[1];const digest=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');fs.writeFileSync(file+'.sha256', digest+'  '+path.basename(file)+'\\n');" "cli-dist/$ASSET_NAME"
          test -s "cli-dist/$ASSET_NAME"
          test -s "cli-dist/$ASSET_NAME.sha256"
          node -e "const crypto=require('crypto');const fs=require('fs');const file=process.argv[1];const expected=fs.readFileSync(file+'.sha256','utf8').trim().split(/\\s+/)[0];const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(!/^[0-9a-f]{64}$/i.test(expected)||actual!==expected){throw new Error('prepared CLI checksum does not match '+file)}" "cli-dist/$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "mclip v__VERSION__"
          releaseBody: |
            mclip v__VERSION__ 已发布，提供 macOS 和 Windows 安装包。它是一个本地优先的剪贴板历史工具，适合从菜单栏/托盘快速找回最近复制过的文本、图片和文件。

            mclip v__VERSION__ is now available, with installers for macOS and Windows. It is a local-first clipboard history tool for quickly bringing back recently copied text, images, and files from the menu bar or system tray.

            ## 本版本包含

            - 文本、图片、文件三类剪贴板历史，重复复制会自动更新到最新位置。
            - 最近历史快速访问，主界面和历史分组展示条数可配置，默认分别为 10 和 50。
            - 主窗口搜索栏和底部操作区固定，大条数历史只滚动中间内容并受显示器工作区保护。
            - 历史分组按真实内容定高，hover 详情使用独立窗口，删除动作统一放在详情标题区。
            - 搜索、复制、删除、清空历史，以及 `CommandOrControl+Shift+V` 全局快捷键。
            - 偏好设置：登录时启动、语言、外观主题、菜单栏图标样式、自动粘贴、展示条数、序号、主窗口 Logo、最大历史条数和保存类型。
            - 颜色代码、Emoji、长文件名与完整文件路径提供更清晰的展示，但复制内容保持原样。
            - `mclip-cli` 提供 Agent 模式、无需读取历史的 help/version、版本感知升级和 SHA-256 校验的预构建安装。
            - 已分类的敏感文本在桌面和 CLI/Agent 默认输出中遮罩；显式 reveal/raw 或 copy 仍使用本地原文。可按稳定来源应用标识排除捕获，并如实报告平台能力。
            - 剪贴板历史仅保存在本机，不会上传到云端。

            ## Included in this release

            - Text, image, and file clipboard history, with repeated copies moved back to the top.
            - Quick access to recent history, with configurable main-window and archive-group item counts, defaulting to 10 and 50 respectively.
            - Fixed search and footer regions, with large histories scrolling only in the middle and native height capped to the monitor work area.
            - Content-sized archive windows, independent hover details, and a consistent detail-owned delete action.
            - Search, copy, delete, clear history, and the `CommandOrControl+Shift+V` global shortcut.
            - Preferences for launch at login, language, appearance theme, menu bar icon style, auto paste, display counts, row numbers, main-window branding, maximum history size, and enabled history types.
            - Clearer color-code, emoji, long-file-name, and full-path presentation without changing copied content.
            - `mclip-cli` Agent Mode, history-independent help/version, version-aware upgrades, and SHA-256-verified prebuilt installation.
            - Classified sensitive text is masked in desktop and default CLI/Agent output; explicit reveal/raw or copy still uses local original content. Capture can be excluded by stable source identity with honest platform capability reporting.
            - Clipboard history stays on your device and is not uploaded.

            ## 隐私边界 / Privacy limits

            敏感内容检测和来源应用识别都是启发式、best-effort 能力，可能误报或漏报；纯 Wayland 当前不支持来源应用排除。遮罩只是展示保护，不是静态加密，原始历史仍以本地明文保存。它不能替代密码管理器、DLP 或泄露防护。

            Sensitive-content detection and source identity are heuristic, best-effort controls that can produce false positives or false negatives; source exclusion is unavailable on pure Wayland. Masking is presentation protection, not encryption at rest, and original history remains local plaintext. It is not a password manager, DLP system, or breach-prevention guarantee.

            ## 下载 / Downloads

            请在下方 Assets 中选择对应系统的安装包。

            Choose the installer for your platform from the Assets below.

            CLI 用户可以使用公开安装脚本，默认下载本 Release 的预构建 `mclip-cli` 及其 SHA-256 校验资产：

            CLI users can use the public install script, which downloads the prebuilt `mclip-cli` and its SHA-256 companion from this release:

            ```bash
            curl -fsSL https://www.mclip.cn/install.sh | sh
            ```

            Windows CLI 用户请在 Git Bash 或兼容 POSIX shell 中运行；桌面应用仍使用下方 `.msi` / `.exe` 安装包。

            Windows CLI users should run the command from Git Bash or another POSIX-compatible shell. Install the desktop app itself from the `.msi` / `.exe` assets below.

            ## 安装提示 / Installation notes

            ### macOS

            当前 macOS 包使用 ad-hoc 签名，尚未使用 Apple Developer ID 公证。请先把 `mclip.app` 拖到“应用程序”。如果首次打开提示“mclip.app 已损坏，无法打开”，并且你信任这个 Release，可在终端执行：

            The macOS build uses ad-hoc signing and is not notarized with an Apple Developer ID yet. Drag `mclip.app` into Applications first. If macOS says “mclip.app is damaged and can’t be opened” and you trust this release, run:

            ```bash
            xattr -dr com.apple.quarantine /Applications/mclip.app
            ```

            然后重新打开 mclip。

            Then open mclip again.

            ### Windows

            当前 Windows 安装包尚未代码签名。安装或首次启动时，Windows SmartScreen 可能提示“未知发布者”；请只在确认信任这个 Release 后继续。

            The Windows installer is not code-signed yet. Windows SmartScreen may warn about an unknown publisher during install or first launch; continue only if you trust this release.
          releaseDraft: true
          prerelease: false

      - name: Upload mclip-cli release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            cli-dist/${{ steps.cli_asset.outputs.asset_name }}
            cli-dist/${{ steps.cli_asset.outputs.asset_name }}.sha256

  verify-cli-release-assets:
    name: Verify CLI release assets
    needs: publish
    runs-on: ubuntu-latest
    # Draft releases are only visible to tokens with push-level repository access.
    permissions:
      contents: write

    steps:
      - name: Download and verify the complete CLI asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          EXPECTED_CLI_ASSETS=(
            "mclip-cli-darwin-arm64"
            "mclip-cli-darwin-arm64.sha256"
            "mclip-cli-windows-x64.exe"
            "mclip-cli-windows-x64.exe.sha256"
          )

          mkdir -p cli-release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir cli-release-assets \
            --pattern "mclip-cli-*"

          for ASSET_NAME in "${EXPECTED_CLI_ASSETS[@]}"; do
            if [ ! -s "cli-release-assets/$ASSET_NAME" ]; then
              echo "Draft Release is missing required CLI asset: $ASSET_NAME" >&2
              exit 1
            fi
          done

          (
            cd cli-release-assets
            sha256sum -c mclip-cli-darwin-arm64.sha256
            sha256sum -c mclip-cli-windows-x64.exe.sha256
          )
