name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2022]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            echo "Update package.json before creating the release tag."
            exit 1
          fi

      - name: Build mclip-cli release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin mclip-cli --release

      - name: Prepare mclip-cli release asset
        id: cli_asset
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) PLATFORM="darwin" ;;
            Windows) PLATFORM="windows" ;;
            Linux) PLATFORM="linux" ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac

          case "$RUNNER_ARCH" in
            X64) ARCH="x64" ;;
            ARM64) ARCH="arm64" ;;
            *) echo "Unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

          EXTENSION=""
          SOURCE_PATH="src-tauri/target/release/mclip-cli"
          if [ "$PLATFORM" = "windows" ]; then
            EXTENSION=".exe"
            SOURCE_PATH="${SOURCE_PATH}.exe"
          fi

          mkdir -p cli-dist
          cp "$SOURCE_PATH" "cli-dist/mclip-cli-${PLATFORM}-${ARCH}${EXTENSION}"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "extension=$EXTENSION" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "mclip v__VERSION__"
          releaseBody: |
            mclip v__VERSION__ 已发布，提供 macOS 和 Windows 安装包。它是一个本地优先的剪贴板历史工具，适合从菜单栏/托盘快速找回最近复制过的文本、图片和文件。

            mclip v__VERSION__ is now available, with installers for macOS and Windows. It is a local-first clipboard history tool for quickly bringing back recently copied text, images, and files from the menu bar or system tray.

            ## 本版本包含

            - 文本、图片、文件三类剪贴板历史，重复复制会自动更新到最新位置。
            - 最近历史快速访问，主界面和历史分组展示条数可配置，默认分别为 10。
            - 主窗口搜索栏和底部操作区固定，大条数历史只滚动中间内容并受显示器工作区保护。
            - 历史分组按真实内容定高，hover 详情使用独立窗口，删除动作统一放在详情标题区。
            - 搜索、复制、删除、清空历史，以及 `CommandOrControl+Shift+V` 全局快捷键。
            - 偏好设置：登录时启动、语言、外观主题、菜单栏图标样式、自动粘贴、展示条数、序号、主窗口 Logo、最大历史条数和保存类型。
            - 颜色代码、Emoji、长文件名与完整文件路径提供更清晰的展示，但复制内容保持原样。
            - `mclip-cli` 提供 Agent 模式、无需读取历史的 help/version 和预构建二进制安装。
            - 剪贴板历史仅保存在本机，不会上传到云端。

            ## Included in this release

            - Text, image, and file clipboard history, with repeated copies moved back to the top.
            - Quick access to recent history, with configurable main-window and archive-group item counts, both defaulting to 10.
            - Fixed search and footer regions, with large histories scrolling only in the middle and native height capped to the monitor work area.
            - Content-sized archive windows, independent hover details, and a consistent detail-owned delete action.
            - Search, copy, delete, clear history, and the `CommandOrControl+Shift+V` global shortcut.
            - Preferences for launch at login, language, appearance theme, menu bar icon style, auto paste, display counts, row numbers, main-window branding, maximum history size, and enabled history types.
            - Clearer color-code, emoji, long-file-name, and full-path presentation without changing copied content.
            - `mclip-cli` Agent Mode, history-independent help/version, and prebuilt-binary installation.
            - Clipboard history stays on your device and is not uploaded.

            ## 下载 / Downloads

            请在下方 Assets 中选择对应系统的安装包。

            Choose the installer for your platform from the Assets below.

            CLI 用户可以使用公开安装脚本，默认优先下载本 Release 的预构建 `mclip-cli`：

            CLI users can use the public install script, which prefers the prebuilt `mclip-cli` from this release:

            ```bash
            curl -fsSL https://www.mclip.cn/install.sh | sh
            ```

            Windows CLI 用户请在 Git Bash 或兼容 POSIX shell 中运行；桌面应用仍使用下方 `.msi` / `.exe` 安装包。

            Windows CLI users should run the command from Git Bash or another POSIX-compatible shell. Install the desktop app itself from the `.msi` / `.exe` assets below.

            ## 安装提示 / Installation notes

            ### macOS

            当前 macOS 包使用 ad-hoc 签名，尚未使用 Apple Developer ID 公证。请先把 `mclip.app` 拖到“应用程序”。如果首次打开提示“mclip.app 已损坏，无法打开”，并且你信任这个 Release，可在终端执行：

            The macOS build uses ad-hoc signing and is not notarized with an Apple Developer ID yet. Drag `mclip.app` into Applications first. If macOS says “mclip.app is damaged and can’t be opened” and you trust this release, run:

            ```bash
            xattr -dr com.apple.quarantine /Applications/mclip.app
            ```

            然后重新打开 mclip。

            Then open mclip again.

            ### Windows

            当前 Windows 安装包尚未代码签名。安装或首次启动时，Windows SmartScreen 可能提示“未知发布者”；请只在确认信任这个 Release 后继续。

            The Windows installer is not code-signed yet. Windows SmartScreen may warn about an unknown publisher during install or first launch; continue only if you trust this release.
          releaseDraft: true
          prerelease: false

      - name: Upload mclip-cli release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: cli-dist/mclip-cli-${{ steps.cli_asset.outputs.platform }}-${{ steps.cli_asset.outputs.arch }}${{ steps.cli_asset.outputs.extension }}
