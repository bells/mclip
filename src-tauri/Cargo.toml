[package]
name = "mclip"
version = "0.1.1"
description = "Cross-platform clipboard history app built with Tauri"
authors = ["Watson"]
edition = "2021"
default-run = "mclip"

[lib]
name = "m_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2.3"
tauri-plugin-global-shortcut = "2"
raw-window-handle = "0.6"
tauri-plugin-single-instance = "2"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSControl", "NSEvent", "NSResponder", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-autostart = "2"
x11rb = "0.13"
